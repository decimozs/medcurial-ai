version: "3.9"

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - AGENT_URL=http://agent:8001
      - WORKER_API_KEY=${WORKER_API_KEY}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEBHOOK_EMAIL=${WEBHOOK_EMAIL}
      - APP_URL=${APP_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/v1/signatures"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./api:/app
      - /app/node_modules
    networks:
      - medcurial

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - API_BASE_URL=http://api:3000/api/v1
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - WORKER_API_KEY=${WORKER_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FORMAT=${LOG_FORMAT}
      - ROBOFLOW_API_KEY=${ROBOFLOW_API_KEY}
      - ROBOFLOW_API_URL=${ROBOFLOW_API_URL}
      - ROBOFLOW_WORKSPACE_NAME=${ROBOFLOW_WORKSPACE_NAME}
      - ROBOFLOW_WORKSPACE_ID=${ROBOFLOW_WORKSPACE_ID}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./worker:/app
      - /app/.venv
    networks:
      - medcurial

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - HF_BASE_URL=${HF_BASE_URL}
      - API_BASE_URL=http://api:3000/api/v1
      - WORKER_API_KEY=${WORKER_API_KEY}
      - FRAUD_MODEL=${FRAUD_MODEL}
      - MCP_HOST=${MCP_HOST}
      - MCP_PORT=${MCP_PORT}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FORMAT=${LOG_FORMAT}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./agent:/app
      - /app/.venv
    networks:
      - medcurial

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./app:/app
      - /app/node_modules
    networks:
      - medcurial

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - API_BASE_URL=http://api:3000/api/v1
      - WORKER_API_KEY=${WORKER_API_KEY}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8002
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FORMAT=${LOG_FORMAT}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./mcp:/app
      - /app/.venv
    networks:
      - medcurial

networks:
  medcurial:
    driver: bridge