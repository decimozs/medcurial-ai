services:
  api:
    build:
      context: ./api
      target: production
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - AGENT_URL=http://agent:8001
      - WORKER_URL=http://worker:8000
      - WORKER_API_KEY=${WORKER_API_KEY}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - WEBHOOK_EMAIL=${WEBHOOK_EMAIL}
      - APP_URL=${APP_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - frontend
      - backend

  worker:
    build:
      context: ./worker
      target: production
    environment:
      - API_BASE_URL=http://api:3000/api/v1
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - WORKER_API_KEY=${WORKER_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FORMAT=${LOG_FORMAT}
      - ROBOFLOW_API_KEY=${ROBOFLOW_API_KEY}
      - ROBOFLOW_API_URL=${ROBOFLOW_API_URL}
      - ROBOFLOW_WORKSPACE_NAME=${ROBOFLOW_WORKSPACE_NAME}
      - ROBOFLOW_WORKSPACE_ID=${ROBOFLOW_WORKSPACE_ID}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB}
      - MAX_UPLOAD_COUNT=${MAX_UPLOAD_COUNT}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: CMD-SHELL python -c "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - backend

  agent:
    build:
      context: ./agent
      target: production
    environment:
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - HF_BASE_URL=${HF_BASE_URL}
      - API_BASE_URL=http://api:3000/api/v1
      - WORKER_API_KEY=${WORKER_API_KEY}
      - FRAUD_MODEL=${FRAUD_MODEL}
      - MCP_HOST=mcp
      - MCP_PORT=8002
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FORMAT=${LOG_FORMAT}
    healthcheck:
      test: CMD-SHELL python -c "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8001/health').status==200 else sys.exit(1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - backend

  app:
    build:
      context: ./app
      target: production
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - frontend

  mcp:
    build:
      context: ./mcp
      target: production
    environment:
      - API_BASE_URL=http://api:3000/api/v1
      - WORKER_API_KEY=${WORKER_API_KEY}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8002
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FORMAT=${LOG_FORMAT}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: CMD-SHELL python -c "import socket,sys; sys.exit(0) if socket.create_connection(('127.0.0.1',8002),timeout=2) else sys.exit(1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
